[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-go"
version = "0.1.0"
description = "Uma biblioteca para facilitar o desenvolvimento de jogos com Pygame"
requires-python = ">=3.10"
dependencies = [
"pygame>=2.5.0"
]

[project.scripts]
pygame-go-init = "pygame_go.loading:main"

[tool.setuptools.packages.find]
where = ["src"]
